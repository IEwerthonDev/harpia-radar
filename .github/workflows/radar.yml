name: Radar diário

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects.yaml
      - config/**
      - templates/**
      - src/**
      - .github/workflows/radar.yml

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CODEBERG_REPOSITORY: ${{ vars.CODEBERG_REPOSITORY }}
    steps:
      # ref: main para um re-run não partir de um commit antigo e ter o push recusado.
      # A deploy key é a que o ruleset da main deixa fazer push.
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Instalar dependências
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Coletar dados
        run: bin/radar collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fazer commit do snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo 'Snapshot sem mudanças.'
          else
            git commit -m "chore(data): snapshot $(date -u +%Y-%m-%d)"
            # No rebase, -X theirs é o nosso commit: fica o snapshot recém-coletado.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push recusado (tentativa ${attempt}); atualizando a main."
              git fetch origin main
              git rebase -X theirs origin/main
            done
            exit 1
          fi

      - name: Gerar a página
        run: bin/radar build
        env:
          RADAR_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Checar acessibilidade (WCAG 2.2 AA)
        run: |
          php -S localhost:8080 -t public > /dev/null 2>&1 &
          npx --yes pa11y-ci@4 --config .pa11yci.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Espelhar no Codeberg Pages
        if: env.CODEBERG_TOKEN != '' && env.CODEBERG_REPOSITORY != ''
        working-directory: public
        run: |
          git init -q -b pages
          git config user.name 'harpia-radar'
          git config user.email 'harpia-radar@users.noreply.codeberg.org'
          git add -A
          git commit -q -m "Publicação de $(date -u +%Y-%m-%d)"
          git push -q --force "https://${CODEBERG_REPOSITORY%%/*}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPOSITORY}.git" pages

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
